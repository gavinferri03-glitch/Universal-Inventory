
name: universal_inventory
description: Universal Inventory mobile application
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Local preferences and permanent device storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  sqflite: ^2.4.2

  # Images and company profile
  image_picker: ^1.1.2
  country_picker: ^2.0.27

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - file_000000002550820b98dbddbb87b2bb92.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_icon.png"
  min_sdk_android: 21
